# pytest.ini
[pytest]
asyncio_mode = auto
markers =
    asyncio: mark a test as asyncio-based

addopts = -v
pythonpath = .


[coverage:run]
# Исключаем файлы __init__.py и conftest.py из отчета
omit =
    */__init__.py
    */tests/conftest.py

[coverage:report]
# Исключаем строки, которые не нужно покрывать
exclude_lines =
    # Не проверять покрытие для строк с "pragma: no cover"
    pragma: no cover

    # Не проверять покрытие для абстрактных методов
    raise NotImplementedError

    # Не проверять покрытие для блока main
    if __name__ == "__main__":