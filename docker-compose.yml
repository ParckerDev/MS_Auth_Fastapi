version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: fa_psg_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}

  api:
    build: .
    container_name: fa_psg_api
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - APP_CONFIG__DB__URL=postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}

volumes:
  postgres_data: